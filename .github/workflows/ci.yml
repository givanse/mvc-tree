name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  static:
    name: Static app (Vite + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Unit tests and viz CI
        working-directory: web
        run: npm test

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: site
          path: web/dist/
          if-no-files-found: error

  ember:
    name: Ember 6.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ember/package-lock.json

      - name: Install Ember dependencies
        working-directory: ember
        run: npm ci

      - name: Ember test
        working-directory: ember
        run: npm test
        env:
          CI: true
