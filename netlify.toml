# Site UI Build settings override this file if set — keep them empty or matching.
# Do not set stop_builds (that also blocks hooks and CLI-triggered remote builds).
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"
  # Ignore runs from web/ (base). Skips previews, branch deploys, and git-push
  # production. Intentional ship is `netlify deploy --prod` (does not run ignore)
  # or a build hook (ignore does not cancel hooks).
  ignore = "./ignore-build.sh"

[build.environment]
  NODE_VERSION = "24"

# skip_prs is already true (Deploy Previews off). Belt-and-suspenders if that
# toggle is later flipped. exit 0 = skip the build.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"
