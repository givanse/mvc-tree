# Site UI Build settings override this file — leave those fields empty or match these values.
# Do not set stop_builds (that also blocks manual / hook deploys). Leave Builds enabled.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"
  # Ignore runs from web/ (base). Script skips previews, branch deploys, and
  # git-push production; proceeds for Clear-cache UI deploys. Build hooks bypass ignore.
  ignore = "./ignore-build.sh"

[build.environment]
  NODE_VERSION = "24"

# Belt-and-suspenders: skip_prs is already true on this site (Deploy Previews off).
# Keep these even if that toggle is later flipped. exit 0 = skip the build.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"
